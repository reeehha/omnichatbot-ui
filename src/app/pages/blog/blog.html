<section class="blog-page">
  <header class="blog-header">
    <span class="eyebrow">OMNIFAI Blogs</span>
    <h1>WhatsApp Automation Guides</h1>
    <p>Explore practical guides on WhatsApp Business API, WhatsApp marketing, and automation for businesses in the UAE.</p>
    <app-search (searchChange)="searchText = $event"></app-search>
  </header>

  <div class="blog-grid" *ngIf="filteredBlogs.length > 0">
    <a
      class="blog-card-link"
      *ngFor="let blog of filteredBlogs"
      [routerLink]="['/blog', blog.slug]"
      [attr.aria-label]="'Read article: ' + blog.title">
      <article class="blog-card">
      <div class="blog-image" *ngIf="blog.image">
        <img [src]="blog.image" [alt]="blog.title" loading="lazy" />
      </div>

      <div class="blog-content">
        <h2 class="blog-title">{{ blog.title }}</h2>
        <span class="category">{{ blog.category }}</span>
        <p class="blog-excerpt">{{ blog.excerpt }}</p>

        <div class="blog-footer">
          <span class="read-time">{{ blog.readTime }}</span>
          <span class="read-more" aria-hidden="true">
            Read Article
            <span aria-hidden="true">→</span>
          </span>
        </div>
      </div>
      </article>
    </a>
  </div>

  <div class="empty-state" *ngIf="filteredBlogs.length === 0">
    <h2>No matching articles</h2>
    <p>Try another search term.</p>
  </div>
</section>
