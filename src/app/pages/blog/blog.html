<section class="blog-page">
  <header class="blog-header">
    <span class="eyebrow">OMNIFAI Blogs</span>
    <app-search (searchChange)="searchText = $event"></app-search>
  </header>

  <div class="blog-grid" *ngIf="filteredBlogs.length > 0">
    <article class="blog-card" *ngFor="let blog of filteredBlogs">
      <div class="blog-cover">
        <h2>{{ blog.title }}</h2>
      </div>

      <div class="blog-content">
        <span class="category">{{ blog.category }}</span>
        <p class="blog-excerpt">{{ blog.excerpt }}</p>

        <div class="blog-footer">
          <span class="read-time">{{ blog.readTime }}</span>
          <a
            class="read-more"
            [routerLink]="['/blog', blog.slug]"
            [attr.aria-label]="'Read more about ' + blog.title">
            Read Article
            <span aria-hidden="true">→</span>
          </a>
        </div>
      </div>
    </article>
  </div>

  <div class="empty-state" *ngIf="filteredBlogs.length === 0">
    <h2>No matching articles</h2>
    <p>Try another search term.</p>
  </div>
</section>
